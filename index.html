<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ปฐมพงศ์ ชัยสรรค์ | Student Portfolio Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg-dark: #070814;
  --card-bg: rgba(18, 22, 41, 0.65);
  --card-border: rgba(255, 255, 255, 0.08);
  --card-hover-border: rgba(139, 92, 246, 0.4);
  
  --purple-glow: #7c3aed;
  --pink-glow: #ec4899;
  --blue-glow: #3b82f6;
  --cyan-accent: #06b6d4;
  --green-accent: #10b981;
  
  --text-main: #ffffff;
  --text-sub: #94a3b8;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Sarabun', 'Plus Jakarta Sans', sans-serif;
  background-color: var(--bg-dark);
  color: var(--text-main);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  padding: 40px 16px 80px;
  position: relative;
  overflow-x: hidden;
}

/* Background Ambient Glows Elements */
.glow-bg-1 {
  position: fixed;
  top: 10%;
  left: 15%;
  width: 450px;
  height: 450px;
  background: radial-gradient(circle, rgba(124, 58, 237, 0.28) 0%, rgba(0,0,0,0) 70%);
  filter: blur(80px);
  z-index: -1;
  pointer-events: none;
}

.glow-bg-2 {
  position: fixed;
  bottom: 15%;
  right: 15%;
  width: 500px;
  height: 500px;
  background: radial-gradient(circle, rgba(236, 72, 153, 0.22) 0%, rgba(0,0,0,0) 70%);
  filter: blur(90px);
  z-index: -1;
  pointer-events: none;
}

/* Container Center Wrapper */
.container {
  width: 100%;
  max-width: 900px;
  display: flex;
  flex-direction: column;
  gap: 28px;
}

/* Header Section */
.header-card {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 20px;
  margin-bottom: 10px;
}

.badge-tag {
  display: inline-block;
  padding: 4px 12px;
  border-radius: 20px;
  background: rgba(255, 255, 255, 0.05);
  border: 1px solid rgba(255, 255, 255, 0.1);
  font-size: 0.75rem;
  font-weight: 600;
  color: #a7f3d0;
  letter-spacing: 1px;
  margin-bottom: 12px;
}

.header-title h1 {
  font-size: clamp(1.8rem, 3.5vw, 2.4rem);
  font-weight: 800;
  line-height: 1.25;
  background: linear-gradient(135deg, #ffffff 30%, #a5b4fc 100%);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.header-title p {
  color: var(--text-sub);
  font-size: 0.92rem;
  margin-top: 8px;
  max-width: 520px;
}

/* Profile Box Right */
.profile-card {
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  backdrop-filter: blur(16px);
  border-radius: 20px;
  padding: 16px 20px;
  display: flex;
  align-items: center;
  gap: 16px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}

.avatar-img {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  object-fit: cover;
  border: 2px solid var(--purple-glow);
  box-shadow: 0 0 15px rgba(124, 58, 237, 0.5);
}

.profile-info h3 {
  font-size: 1.05rem;
  font-weight: 700;
  color: #fff;
}

.profile-info p {
  font-size: 0.8rem;
  color: var(--text-sub);
}

.status-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  margin-top: 4px;
  font-size: 0.75rem;
  color: #34d399;
  background: rgba(52, 211, 153, 0.1);
  padding: 2px 8px;
  border-radius: 12px;
}

.status-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background-color: #34d399;
  box-shadow: 0 0 8px #34d399;
}

/* Work Cards List */
.works-list {
  display: flex;
  flex-direction: column;
  gap: 16px;
}

.work-item {
  position: relative;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  backdrop-filter: blur(12px);
  border-radius: 18px;
  padding: 20px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.work-item:hover {
  border-color: var(--card-hover-border);
  transform: translateY(-2px);
  box-shadow: 0 10px 30px -5px rgba(124, 58, 237, 0.25);
}

.work-left {
  display: flex;
  align-items: center;
  gap: 20px;
}

.work-num {
  font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 1.25rem;
  font-weight: 800;
  color: #a5b4fc;
  background: rgba(255, 255, 255, 0.05);
  width: 42px;
  height: 42px;
  border-radius: 12px;
  display: grid;
  place-items: center;
  shrink: 0;
}

.type-badge {
  display: inline-block;
  font-size: 0.72rem;
  font-weight: 600;
  color: #93c5fd;
  background: rgba(59, 130, 246, 0.15);
  border: 1px solid rgba(59, 130, 246, 0.3);
  padding: 2px 8px;
  border-radius: 6px;
  margin-bottom: 4px;
}

.work-details h3 {
  font-size: 1.05rem;
  font-weight: 700;
  color: #ffffff;
}

.work-details p {
  font-size: 0.85rem;
  color: var(--text-sub);
  margin-top: 2px;
}

/* Buttons Group */
.btns-wrap {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}

.btn-action {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  border-radius: 10px;
  font-size: 0.85rem;
  font-weight: 600;
  color: #ffffff;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid rgba(255, 255, 255, 0.12);
  transition: all 0.2s ease;
  white-space: nowrap;
}

.btn-action:hover {
  background: rgba(255, 255, 255, 0.18);
  transform: translateY(-1px);
}

.btn-action.gradient-purple {
  background: linear-gradient(135deg, #6366f1, #a855f7);
  border: none;
  box-shadow: 0 4px 15px rgba(168, 85, 247, 0.4);
}

.btn-action.gradient-purple:hover {
  box-shadow: 0 6px 20px rgba(168, 85, 247, 0.6);
}

.btn-action.gradient-pink {
  background: linear-gradient(135deg, #ec4899, #f43f5e);
  border: none;
  box-shadow: 0 4px 15px rgba(236, 72, 153, 0.4);
}

.btn-action.gradient-pink:hover {
  box-shadow: 0 6px 20px rgba(236, 72, 153, 0.6);
}

.btn-action.green-glow {
  background: rgba(16, 185, 129, 0.2);
  border: 1px solid rgba(16, 185, 129, 0.5);
  color: #6ee7b7;
}

.btn-action.green-glow:hover {
  background: rgba(16, 185, 129, 0.35);
}

/* Featured Hero Item (Work 5) */
.work-item.hero {
  border: 1px solid rgba(236, 72, 153, 0.4);
  background: linear-gradient(135deg, rgba(24, 20, 43, 0.8) 0%, rgba(18, 22, 41, 0.7) 100%);
  box-shadow: 0 8px 25px -5px rgba(236, 72, 153, 0.2);
}

.work-item.hero .work-num {
  color: #f472b6;
  background: rgba(236, 72, 153, 0.15);
}

/* Footer */
footer {
  text-align: center;
  color: var(--text-sub);
  font-size: 0.8rem;
  margin-top: 10px;
}

/* Responsive */
@media (max-width: 768px) {
  .header-card {
    flex-direction: column;
    align-items: flex-start;
  }
  .profile-card {
    width: 100%;
  }
  .work-item {
    flex-direction: column;
    align-items: flex-start;
  }
  .btns-wrap {
    width: 100%;
    margin-top: 8px;
  }
}
</style>
</head>
<body>

<!-- Ambient Glow Backgrounds -->
<div class="glow-bg-1"></div>
<div class="glow-bg-2"></div>

<div class="container">

  <!-- Header Header & Profile Box -->
  <header class="header-card">
    <div class="header-title">
      <span class="badge-tag">STUDENT PORTFOLIO HUB</span>
      <h1>ผลงานรายวิชา Graph Database Neo4j, Python และ Streamlit</h1>
      <p>รวบรวมชิ้นงาน รายงาน และโปรเจกต์รายวิชาในภาคเรียนนี้ทั้งหมด</p>
    </div>

    <!-- User Profile Card -->
    <div class="profile-card">
      <img src="profile.jpg" alt="Patomphong" class="avatar-img" onerror="this.src='https://via.placeholder.com/64'">
      <div class="profile-info">
        <h3>นายปฐมพงศ์ ชัยสรรค์</h3>
        <p>รหัสนักศึกษา: 664245039</p>
        <p>หมู่เรียน 66/44 | คณะวิทยาศาสตร์ฯ</p>
        <div class="status-tag">
          <span class="status-dot"></span> Active Student
        </div>
      </div>
    </div>
  </header>

  <!-- Works List Section -->
  <main class="works-list" id="works-container"></main>

  <!-- Footer -->
  <footer>
    <p>© 2026 Patomphong Chaisan — Nakhon Pathom Rajabhat University</p>
  </footer>

</div>

<script>
const WORKS = [
  { 
    title: "Transaction, Concurrency & Recovery (MySQL / InnoDB)", 
    desc: "เอกสารและเนื้อหาการประมวลผลผ่าน Google Colab", 
    type: "Google Colab",
    link: "https://colab.research.google.com/drive/13BjxxXaivfA6MX6x4Plh6jIczTwOJvtO?usp=sharing" 
  },
  { 
    title: "Club Recommendation Graph ด้วย Neo4j", 
    desc: "ระบบบนไฟล์ PDF พร้อมแบบแบ่งส่วนย่อย", 
    type: "GitHub PDF (ดาวน์โหลด)",
    link: "https://drive.google.com/file/d/1HoP4TRbRENGHdThw7UrPjYJeXxpz14Dk/view?usp=sharing" 
  },
  { 
    title: "Flower Recommender System (10 users, 12 flowers)", 
    desc: "เอกสารและเนื้อหาการประมวลผลผ่าน Google Colab / Drive", 
    type: "Google Drive",
    link: "https://colab.research.google.com/drive/1caLO0FuKrAdIsE95sTMYLVsM-qGiAc6J?usp=sharing" 
  },
  { 
    title: "Flower Recommender System เชื่อมต่อ Neo4j", 
    desc: "เอกสารและเนื้อหาการประมวลผลผ่าน Google Colab", 
    type: "Google Colab",
    link: "https://colab.research.google.com/drive/1carNej5QFN3itsfvnJW_LWAhx3AzqwM6?usp=sharing" 
  },
  { 
    title: "Flower Recommender System", 
    desc: "ระบบแนะนำประมวลผลด้วย Machine Learning & Streamlit", 
    type: "Featured Project • Streamlit App & PDF", 
    hero: true,
    extra: [
      { label: "⚡ เปิดเว็บ Streamlit", href: "https://flowerrecommendersystem-4rmsr7ntylr7sjqcsgchbv.streamlit.app/", class: "btn-action gradient-pink" },
      { label: "📄 หน้าเว็บ PDF", href: "https://drive.google.com/file/d/1XJGPUqpy8E8kORY7-WBJ2NQGBNg_X5S3/view?usp=sharing", class: "btn-action green-glow" },
      { label: "💻 Drive / Code", href: "https://github.com/song03062547-stack/FlowerRecommenderSystem", class: "btn-action" }
    ] 
  }
];

const container = document.getElementById("works-container");

container.innerHTML = WORKS.map((w, index) => {
  const numStr = String(index + 1).padStart(2, '0');
  
  let buttonsHTML = "";
  if (w.extra) {
    buttonsHTML = w.extra.map(b => `<a href="${b.href}" target="_blank" rel="noopener" class="${b.class}">${b.label}</a>`).join('');
  } else {
    buttonsHTML = `<a href="${w.link}" target="_blank" rel="noopener" class="btn-action gradient-purple">🚀 เปิดดูงาน</a>`;
  }

  return `
    <article class="work-item ${w.hero ? 'hero' : ''}">
      <div class="work-left">
        <div class="work-num">${numStr}</div>
        <div class="work-details">
          <span class="type-badge">${w.type}</span>
          <h3>${w.title}</h3>
          <p>${w.desc}</p>
        </div>
      </div>
      <div class="btns-wrap">
        ${buttonsHTML}
      </div>
    </article>
  `;
}).join('');
</script>

</body>
</html>
