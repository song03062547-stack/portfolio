<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ปฐมพงศ์ ชัยสรรค์ | ผลงานรายวิชา</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#141b34; --blue:#3b5bdb; --blue-d:#2f49b0; --mint:#0ca678;
  --bg:#f6f7fb; --card:#fff; --line:#e1e5f0; --muted:#5c6482;
}
*{box-sizing:border-box;margin:0}
body{font-family:'IBM Plex Sans Thai',sans-serif;background:var(--bg);color:var(--ink);line-height:1.65}
a{color:inherit;text-decoration:none}
a:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

.layout{display:grid;grid-template-columns:320px 1fr;min-height:100vh}

aside{background:var(--ink);color:#fff;padding:48px 32px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:20px}
.mono{width:84px;height:84px;border-radius:20px;background:var(--blue);display:grid;place-items:center;font-size:2.4rem;font-weight:700}
aside h1{font-size:1.65rem;line-height:1.35;font-weight:700}
.en{color:#9fb0ff;font-size:.95rem;margin-top:-12px}
.facts{display:grid;gap:10px;font-size:.92rem;border-top:1px solid rgba(255,255,255,.15);padding-top:20px}
.facts div{display:flex;justify-content:space-between;gap:12px}
.facts span:first-child{color:#aab2d3}
.facts span:last-child{text-align:right;font-weight:500}
.gh{margin-top:auto;display:inline-block;text-align:center;padding:10px 16px;border-radius:10px;background:#fff;color:var(--ink);font-weight:600}
.gh:hover{background:#e7ebff}

main{padding:56px 48px 40px;max-width:820px}
main h2{font-size:1.8rem;font-weight:700}
.lead{color:var(--muted);margin:6px 0 32px}

.work{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px 26px 24px 92px;margin-bottom:18px}
.work .n{position:absolute;left:26px;top:22px;font-family:'IBM Plex Mono',monospace;font-size:2.2rem;color:var(--blue)}
.work h3{font-size:1.2rem;font-weight:600;line-height:1.4}
.work p{color:var(--muted);font-size:.95rem;margin:4px 0 12px}
.kind{display:inline-block;font-size:.78rem;font-weight:600;color:var(--mint);background:#e3f8f0;border-radius:6px;padding:0 9px;margin-bottom:6px}
.btns{display:flex;flex-wrap:wrap;gap:8px}
.btn{padding:7px 16px;border-radius:9px;font-size:.9rem;font-weight:600;border:1px solid var(--line);background:#fff}
.btn:hover{background:#eef1ff}
.btn.main{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.main:hover{background:var(--blue-d)}
.work.hero{border:2px solid var(--blue)}

footer{color:var(--muted);font-size:.85rem;margin-top:28px}

@media(max-width:860px){
  .layout{grid-template-columns:1fr}
  aside{position:static;height:auto;padding:32px 24px}
  .gh{margin-top:0}
  main{padding:32px 20px}
  .work{padding:20px 20px 20px 20px}
  .work .n{position:static;display:block;font-size:1.5rem;margin-bottom:2px}
}
</style>
</head>
<body>
<div class="layout">

  <aside>
    <div class="mono" aria-hidden="true">ป</div>
    <h1>ปฐมพงศ์<br>ชัยสรรค์</h1>
    <p class="en">Patomphong Chaisan</p>
    <div class="facts">
      <div><span>รหัสนักศึกษา</span><span>664245039</span></div>
      <div><span>หมู่เรียน</span><span>66/44</span></div>
      <div><span>คณะ</span><span>วิทยาศาสตร์และเทคโนโลยี</span></div>
      <div><span>สาขา</span><span>วิทยาการคอมพิวเตอร์</span></div>
    </div>
    <a class="gh" href="https://github.com/song03062547-stack" target="_blank" rel="noopener">GitHub โปรไฟล์ ↗</a>
  </aside>

  <main>
    <h2>ผลงานรายวิชา</h2>
    <p class="lead">5 ชิ้นงาน เปิดดูไฟล์จาก GitHub ได้เลย</p>
    <div id="list"></div>
    <footer>เผยแพร่ผ่าน GitHub Pages</footer>
  </main>

</div>

<script>
/* ===== แก้ข้อมูลตรงนี้ =====
   link = ลิงก์ที่ปุ่มหลักจะเปิด (Colab หรือ Drive)
   type = "colab" | "pdf" | "drive" | "app"                         */
const WORKS = [
  { title:"Transaction, Concurrency & Recovery (MySQL / InnoDB)", desc:"โน้ตบุ๊ก Colab เรื่องทรานแซกชัน การทำงานพร้อมกัน และการกู้คืนข้อมูลบน MySQL (InnoDB)", type:"colab",
    link:"https://colab.research.google.com/drive/13BjxxXaivfA6MX6x4Plh6jIczTwOJvtO?usp=sharing" },
  { title:"Club Recommendation Graph ด้วย Neo4j", desc:"เอกสารออกแบบกราฟแนะนำชมรมด้วย Neo4j", type:"pdf",
    link:"https://drive.google.com/file/d/1HoP4TRbRENGHdThw7UrPjYJeXxpz14Dk/view?usp=sharing" },
  { title:"Flower Recommender System (10 users, 12 flowers)", desc:"โน้ตบุ๊กระบบแนะนำดอกไม้ ใช้ข้อมูลผู้ใช้ 10 คนกับดอกไม้ 12 ชนิด", type:"drive",
    link:"https://colab.research.google.com/drive/1uAD7yBbwpW1xT8RkCfMJgJqsZWTMzhSu?usp=sharing" },
  { title:"Flower Recommender System เชื่อมต่อ Neo4j", desc:"โน้ตบุ๊กระบบแนะนำดอกไม้ที่เก็บข้อมูลเป็นกราฟบน Neo4j", type:"colab",
    link:"https://colab.research.google.com/drive/1carNej5QFN3itsfvnJW_LWAhx3AzqwM6?usp=sharing" },
  { title:"Flower Recommender System", desc:"เว็บแอประบบแนะนำดอกไม้ สร้างด้วย Streamlit พร้อมสไลด์นำเสนอและซอร์สโค้ด", type:"app", hero:true,
    extra:[
      {label:"เปิดเว็บแอป", href:"https://flowerrecommendersystem-4rmsr7ntylr7sjqcsgchbv.streamlit.app/", main:true},
      {label:"สไลด์นำเสนอ (PDF)", href:"https://drive.google.com/file/d/1XJGPUqpy8E8kORY7-WBJ2NQGBNg_X5S3/view?usp=sharing"},
      {label:"ซอร์สโค้ด", href:"https://github.com/song03062547-stack/FlowerRecommenderSystem"}
    ] }
];
/* ===== จบส่วนที่ต้องแก้ ===== */

const kindLabel = {pdf:"เอกสาร PDF", colab:"Google Colab", drive:"โน้ตบุ๊ก (Google Drive)", app:"เว็บแอป"};
const mainLabel = {pdf:"เปิดไฟล์ PDF", colab:"เปิดใน Colab", drive:"เปิดไฟล์"};
const btn = (label, href, main) =>
  `<a class="btn${main ? " main" : ""}" href="${href}" target="_blank" rel="noopener">${label} ↗</a>`;

document.getElementById("list").innerHTML = WORKS.map((w, i) => {
  let buttons = w.link ? btn(mainLabel[w.type], w.link, true) : "";
  if (w.extra) buttons += w.extra.map(e => btn(e.label, e.href, e.main)).join("");
  return `<article class="work${w.hero ? " hero" : ""}" id="w${i+1}">
    <span class="n">${String(i+1).padStart(2,"0")}</span>
    <span class="kind">${kindLabel[w.type]}</span>
    <h3>${w.title}</h3>
    <p>${w.desc}</p>
    <div class="btns">${buttons}</div>
  </article>`;
}).join("");
</script>
</body>
</html>
